name: Build Firmware (S3 + C3)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install arduino-cli
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR="$HOME/.local/bin" sh

      - name: Install ESP32 core
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Find sketch folder
        id: find_sketch
        run: |
          set -e
          SKETCH=""
          for d in */; do
            d="${d%/}"
            if ls "$d"/*.ino >/dev/null 2>&1; then
              SKETCH="$d"
              break
            fi
          done
          if [ -z "$SKETCH" ]; then
            echo "ERROR: sketch folder with .ino not found"
            exit 1
          fi
          echo "Found sketch folder: $SKETCH"
          echo "SKETCH=$SKETCH" >> $GITHUB_OUTPUT

      - name: Build all boards
        run: |
          set -e
          SKETCH="${{ steps.find_sketch.outputs.SKETCH }}"
          echo "Using SKETCH=$SKETCH"

          mkdir -p flasher/firmware/s3 flasher/firmware/c3s flasher/firmware/c3z flasher/manifests
          EXPLOITS="505 672 700 900 1352"

          MKLS=$(find ~/.arduino15 -type f -name "mklittlefs*" 2>/dev/null | head -n 1)
          echo "Found mklittlefs: $MKLS"
          chmod +x "$MKLS"

          # ============ S3 (16 MB, кастомные разделы) ============
          echo "=== S3 ==="
          cat > "$SKETCH/partitions.csv" <<'EOF'
          # Name,   Type, SubType, Offset,  Size, Flags
          nvs,      data, nvs,     0x9000,  0x5000,
          otadata,  data, ota,     0xe000,  0x2000,
          app0,     app,  ota_0,   0x10000, 0x200000,
          app1,     app,  ota_1,   0x210000,0x200000,
          spiffs,   data, spiffs,  0x410000,0xBE0000,
          coredump, data, coredump,0xFF0000,0x10000,
          EOF

          arduino-cli compile \
            --fqbn esp32:esp32:esp32s3:FlashSize=16M,PartitionScheme=custom,CDCOnBoot=default \
            --output-dir ./build-s3 "$SKETCH"

          cp build-s3/*.bootloader.bin flasher/firmware/s3/bootloader.bin
          cp build-s3/*.partitions.bin flasher/firmware/s3/partitions.bin
          cp build-s3/*.ino.bin        flasher/firmware/s3/firmware.bin
          find ~/.arduino15 -name "boot_app0.bin" -exec cp {} flasher/firmware/s3/ \;

          "$MKLS" -c "$SKETCH/data" -s 0xBE0000 -p 256 -b 4096 flasher/firmware/s3/spiffs-all.bin
          for e in $EXPLOITS; do
            rm -rf staging && mkdir -p staging/ran
            cp -r "$SKETCH/data/index.html" "$SKETCH/data/style.css" staging/ 2>/dev/null || true
            cp -r "$SKETCH/data/ran/index.html" staging/ran/ 2>/dev/null || true
            cp -r "$SKETCH/data/ran/css" staging/ran/ 2>/dev/null || true
            cp -r "$SKETCH/data/ran/shared" staging/ran/ 2>/dev/null || true
            cp -r "$SKETCH/data/ran/$e" staging/ran/
            "$MKLS" -c staging -s 0xBE0000 -p 256 -b 4096 flasher/firmware/s3/spiffs-$e.bin
          done

          # ============ C3 (4 MB, схема default) ============
          echo "=== C3 ==="
          # Удаляем кастомный partitions.csv, чтобы не путался
          rm -f "$SKETCH/partitions.csv"

          # --- C3 Super Mini ---
          echo "--- C3 Super Mini ---"
          arduino-cli compile \
            --fqbn esp32:esp32:nologo_esp32c3_super_mini:PartitionScheme=default,CDCOnBoot=cdc \
            --output-dir ./build-c3s "$SKETCH"

          cp build-c3s/*.bootloader.bin flasher/firmware/c3s/bootloader.bin
          cp build-c3s/*.partitions.bin flasher/firmware/c3s/partitions.bin
          cp build-c3s/*.ino.bin        flasher/firmware/c3s/firmware.bin
          find ~/.arduino15 -name "boot_app0.bin" -exec cp {} flasher/firmware/c3s/ \;

          for e in $EXPLOITS; do
            rm -rf staging && mkdir -p staging/ran
            cp -r "$SKETCH/data/index.html" "$SKETCH/data/style.css" staging/ 2>/dev/null || true
            cp -r "$SKETCH/data/ran/index.html" staging/ran/ 2>/dev/null || true
            cp -r "$SKETCH/data/ran/css" staging/ran/ 2>/dev/null || true
            cp -r "$SKETCH/data/ran/shared" staging/ran/ 2>/dev/null || true
            cp -r "$SKETCH/data/ran/$e" staging/ran/
            "$MKLS" -c staging -s 0x160000 -p 256 -b 4096 flasher/firmware/c3s/spiffs-$e.bin
          done

          # --- C3 Zero (generic) ---
          echo "--- C3 Zero ---"
          arduino-cli compile \
            --fqbn esp32:esp32:esp32c3:PartitionScheme=default,CDCOnBoot=cdc \
            --output-dir ./build-c3z "$SKETCH"

          cp build-c3z/*.bootloader.bin flasher/firmware/c3z/bootloader.bin
          cp build-c3z/*.partitions.bin flasher/firmware/c3z/partitions.bin
          cp build-c3z/*.ino.bin        flasher/firmware/c3z/firmware.bin
          find ~/.arduino15 -name "boot_app0.bin" -exec cp {} flasher/firmware/c3z/ \;

          for e in $EXPLOITS; do
            rm -rf staging && mkdir -p staging/ran
            cp -r "$SKETCH/data/index.html" "$SKETCH/data/style.css" staging/ 2>/dev/null || true
            cp -r "$SKETCH/data/ran/index.html" staging/ran/ 2>/dev/null || true
            cp -r "$SKETCH/data/ran/css" staging/ran/ 2>/dev/null || true
            cp -r "$SKETCH/data/ran/shared" staging/ran/ 2>/dev/null || true
            cp -r "$SKETCH/data/ran/$e" staging/ran/
            "$MKLS" -c staging -s 0x160000 -p 256 -b 4096 flasher/firmware/c3z/spiffs-$e.bin
          done

          echo "=== Firmware tree ==="
          find flasher/firmware -type f -exec ls -la {} \;

      - name: Generate manifests
        run: |
          set -e
          EXPLOITS="505 672 700 900 1352"

          gen() {
            local board=$1 fw=$2 chip=$3 offset=$4 spiffs=$5
            local name="ESP32 - ${chip} - FW ${fw}"
            [ "$fw" = "all" ] && name="ESP32 - ${chip} - all FW"
            cat > flasher/manifests/${board}-${fw}.json <<EOF
          {
            "name": "${name}",
            "version": "1.0.0",
            "new_install_prompt_erase": true,
            "builds": [
              {
                "chipFamily": "${chip}",
                "parts": [
                  { "path": "../firmware/${board}/bootloader.bin", "offset": 0 },
                  { "path": "../firmware/${board}/partitions.bin", "offset": 32768 },
                  { "path": "../firmware/${board}/boot_app0.bin",  "offset": 57344 },
                  { "path": "../firmware/${board}/firmware.bin",   "offset": 65536 },
                  { "path": "../firmware/${board}/${spiffs}",      "offset": ${offset} }
                ]
              }
            ]
          }
          EOF
          }

          # S3: все FW + по одному
          gen s3 all "ESP32-S3" 4259840 "spiffs-all.bin"
          for e in $EXPLOITS; do gen s3 $e "ESP32-S3" 4259840 "spiffs-$e.bin"; done

          # C3 Super Mini (chipFamily = ESP32-C3, offset = 0x290000)
          for e in $EXPLOITS; do gen c3s $e "ESP32-C3" 2686976 "spiffs-$e.bin"; done

          # C3 Zero (то же самое)
          for e in $EXPLOITS; do gen c3z $e "ESP32-C3" 2686976 "spiffs-$e.bin"; done

          echo "=== Manifests ==="
          ls -la flasher/manifests/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./flasher
          publish_branch: gh-pages
          force_orphan: true